name: FlightWatch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flightwatch
  cancel-in-progress: false

defaults:
  run:
    working-directory: FlightWatch-GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skanowanie cen
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          FW_EMAIL_USER: ${{ secrets.FW_EMAIL_USER }}
          FW_EMAIL_PASSWORD: ${{ secrets.FW_EMAIL_PASSWORD }}
          FW_EMAIL_TO: ${{ secrets.FW_EMAIL_TO }}
        run: python -m flightwatch.main

      - name: Generowanie strony
        run: python -m flightwatch.site --out ../docs/index.html

      - name: Zapisz historię cen i stronę
        run: |
          git config user.name "flightwatch-bot"
          git config user.email "flightwatch-bot@users.noreply.github.com"
          # odłóż świeże wyniki na bok, pobierz najnowszą wersję repozytorium, przywróć wyniki
          cp flightwatch.sqlite3 /tmp/flightwatch.sqlite3
          cp -r ../docs /tmp/docs
          git checkout -- . || true
          git clean -fdq ../docs || true
          git pull origin "${GITHUB_REF_NAME}"
          cp /tmp/flightwatch.sqlite3 flightwatch.sqlite3
          rm -rf ../docs && cp -r /tmp/docs ../docs
          git add flightwatch.sqlite3 ../docs
          if git diff --cached --quiet; then
            echo "brak zmian"
          else
            git commit -m "Aktualizacja cen i strony [skip ci]"
            git push
          fi
