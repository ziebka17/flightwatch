name: FlightWatch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flightwatch
  cancel-in-progress: false

defaults:
  run:
    working-directory: FlightWatch-GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skanowanie cen
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          FW_EMAIL_USER: ${{ secrets.FW_EMAIL_USER }}
          FW_EMAIL_PASSWORD: ${{ secrets.FW_EMAIL_PASSWORD }}
          FW_EMAIL_TO: ${{ secrets.FW_EMAIL_TO }}
        run: python -m flightwatch.main

      - name: Zapisz historię cen
        run: |
          git config user.name "flightwatch-bot"
          git config user.email "flightwatch-bot@users.noreply.github.com"
          git add flightwatch.sqlite3
          if git diff --cached --quiet; then
            echo "brak zmian"
          else
            git commit -m "Aktualizacja historii cen [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
